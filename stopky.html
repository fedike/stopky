<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stopky</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: #0b0b0f;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stopky {
    background: #1e5fd9;
    border-radius: 24px;
    padding: 28px;
    width: 360px;
    max-width: 90vw;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }

  .displej {
    background: #000;
    border-radius: 14px;
    padding: 28px 16px;
    text-align: center;
    margin-bottom: 24px;
    box-shadow: inset 0 0 8px rgba(0,0,0,0.6);
  }

  .cas {
    color: #ffffff;
    font-size: 2.6rem;
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
    font-weight: 600;
    word-break: break-word;
  }

  .cas .stotiny {
    font-size: 1.6rem;
    color: #cfd8ff;
  }

  .tlacidla {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  button {
    background: #000;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    padding: 14px 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.08s ease, opacity 0.15s ease;
  }

  button:hover { opacity: 0.85; }
  button:active { transform: scale(0.96); }

  @media (max-width: 400px) {
    .cas { font-size: 2rem; }
    .cas .stotiny { font-size: 1.2rem; }
  }
</style>
</head>
<body>

<div class="stopky">
  <div class="displej">
    <div class="cas" id="cas">00:00:00<span class="stotiny">.00</span></div>
  </div>
  <div class="tlacidla">
    <button id="btnStart">Zapnúť</button>
    <button id="btnStop">Stop</button>
    <button id="btnReset">Reset</button>
  </div>
</div>

<script>
  let startTime = 0;
  let elapsed = 0;
  let timerId = null;
  let running = false;

  const casEl = document.getElementById('cas');

  function formatuj(ms) {
    const stotiny = Math.floor((ms % 1000) / 10);
    const totalSekundy = Math.floor(ms / 1000);
    const sekundy = totalSekundy % 60;
    const minuty = Math.floor(totalSekundy / 60) % 60;
    const hodiny = Math.floor(totalSekundy / 3600);

    const pad = (n) => String(n).padStart(2, '0');

    return {
      hlavny: `${pad(hodiny)}:${pad(minuty)}:${pad(sekundy)}`,
      stotiny: pad(stotiny)
    };
  }

  function vykresli() {
    const celkovy = running ? (elapsed + (Date.now() - startTime)) : elapsed;
    const { hlavny, stotiny } = formatuj(celkovy);
    casEl.innerHTML = `${hlavny}<span class="stotiny">.${stotiny}</span>`;
  }

  function tick() {
    vykresli();
    timerId = requestAnimationFrame(tick);
  }

  document.getElementById('btnStart').addEventListener('click', () => {
    if (running) return;
    running = true;
    startTime = Date.now();
    tick();
  });

  document.getElementById('btnStop').addEventListener('click', () => {
    if (!running) return;
    running = false;
    elapsed += Date.now() - startTime;
    cancelAnimationFrame(timerId);
    vykresli();
  });

  document.getElementById('btnReset').addEventListener('click', () => {
    running = false;
    cancelAnimationFrame(timerId);
    elapsed = 0;
    startTime = 0;
    vykresli();
  });

  vykresli();
</script>

</body>
</html>
